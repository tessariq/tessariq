name: CI

# Full pipeline (checks + build/test matrix + Docker integration and e2e). Skips
# changes that touch only planning, spec, doc, or agent-skill paths — those are
# gated by the cheap fast lane in planning.yml, whose `paths:` set is the exact
# mirror of the `paths-ignore` below. Keep the two lists identical; they are
# guarded by TestWorkflowPathLanesAreExactMirrors. Mutation testing lives in
# mutation.yml (nightly), never here. release.yml (tags-only) is unaffected.
on:
  # Manual trigger to run the full pipeline on demand — e.g. to force CI on a
  # branch whose changes are all in the paths-ignore set below.
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.taskrail/**'
      - 'planning/**'
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'README.md'
  push:
    branches:
      - main
    paths-ignore:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.taskrail/**'
      - 'planning/**'
      - 'specs/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'CLAUDE.md'
      - 'README.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Verify formatting
        run: task fmt:check

      - name: Vet
        run: task vet

      - name: Check dependency licenses
        run: task licenses:check

      - name: Validate Taskrail tracked-work state and live spec refs  # hard failure gate
        run: task workflow:validate

      - name: Verify mirrored workflow skills
        run: task workflow:check-skills

      - name: Report active milestone spec coverage  # advisory
        run: task workflow:verify:spec

      - name: Validate GoReleaser config
        run: task release:check

  unit-tests:
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Pull requests run Linux-only for fast feedback; pushes to main and manual
      # dispatch run the full matrix, so cross-platform breaks are caught at merge.
      matrix:
        runner: ${{ github.event_name == 'pull_request'
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["ubuntu-latest","ubuntu-24.04-arm","macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Unit tests
        run: task test

  smoke-tests:
    needs: checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ github.event_name == 'pull_request'
          && fromJSON('["ubuntu-latest"]')
          || fromJSON('["ubuntu-latest","ubuntu-24.04-arm","macos-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Build binary
        run: task build

      - name: Smoke test --help
        run: ./tessariq --help

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: Integration tests
        run: task test:integration

      - name: Cleanup orphaned Docker resources
        if: always()
        run: |
          docker ps -aq --filter "name=tessariq-" | xargs -r docker rm -f || true
          docker network ls --filter "name=tessariq-" -q | xargs -r docker network rm || true
          docker images --filter "reference=tessariq-test-*" -q | xargs -r docker rmi -f || true

  e2e-tests:
    needs: [unit-tests, smoke-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup

      - name: End-to-end tests
        run: task test:e2e

      - name: Cleanup orphaned Docker resources
        if: always()
        run: |
          docker ps -aq --filter "name=tessariq-" | xargs -r docker rm -f || true
          docker network ls --filter "name=tessariq-" -q | xargs -r docker network rm || true
          docker images --filter "reference=tessariq-test-*" -q | xargs -r docker rmi -f || true
