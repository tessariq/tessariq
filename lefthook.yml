# Local git hooks for tessariq (opt-in).
#
# Install:  task hooks:install   (runs `lefthook install`)
# These hooks mirror the fast checks in .github/workflows/ci.yml; CI remains the
# authoritative gate. Pinned tool version: lefthook v1.13.6 (see mise.toml and
# the Taskfile `hooks:install` target). Do not bypass hooks with `--no-verify`.

pre-commit:
  parallel: true
  commands:
    # Identity has no staged file to key off, so enforce it on every commit.
    author-identity:
      run: bash scripts/check-author.sh
    gofmt:
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l {staged_files})"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:" >&2
          echo "$unformatted" >&2
          exit 1
        fi
    # Each command is scoped to the files it can actually be broken by, so a
    # docs-only commit runs nothing but the message check. CI remains the
    # authoritative gate and validates both lanes regardless.
    vet:
      glob: "*.go"
      run: task vet
    workflow-validate:
      glob: "{planning/**,specs/**,.taskrail/**}"
      run: task workflow:validate
    skill-parity:
      # The manifest, the vendor script and the toolchain pin are all inputs to
      # the same check, so editing any of them alone must still run it.
      glob: "{.agents/skills/**,.claude/skills/**,docs/workflow/skills-manifest.yml,scripts/vendor-skills.sh,mise.toml}"
      run: task workflow:check-skills
    commit-message-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-commit-msg.sh,scripts/check-attribution.sh,scripts/check-commit-msg-test.sh}"
      run: task test:commit-msg
    author-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-author.sh,scripts/check-author-test.sh}"
      run: task test:author
    push-message-checker:
      glob: "{lefthook.yml,Taskfile.yml,scripts/check-push-messages.sh,scripts/check-attribution.sh,scripts/check-author.sh,scripts/check-push-messages-test.sh}"
      run: task test:push-messages

commit-msg:
  commands:
    message-policy:
      run: bash scripts/check-commit-msg.sh {1}

pre-push:
  commands:
    message-policy:
      priority: 1
      run: bash scripts/check-push-messages.sh
    tests:
      priority: 2
      run: task test
